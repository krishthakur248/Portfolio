name: Update Activity Heatmaps

on:
  schedule:
    # Daily at 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch activity data
        env:
          GITHUB_USERNAME: krishthakur248
          LEETCODE_USERNAME: krishthakur248
        run: node scripts/fetch-activity.mjs

      - name: Commit activity.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/activity.json
          if git diff --cached --quiet; then
            echo "No changes to activity.json — skipping commit."
          else
            git commit -m "chore: update activity heatmap data [skip ci]"
            git push
          fi
