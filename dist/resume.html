<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krish Thakur — Resume</title>
  <link rel="icon" type="image/png" href="/img/icons/resume.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed top floating header */
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 900px;
      margin: 12px auto 20px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
    }

    .info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(78, 204, 163, 0.4);
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
      transition: all 140ms ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #4ecca3;
      color: #090c14;
      font-weight: 600;
      border-color: #4ecca3;
    }

    .btn-primary:hover {
      background: #3ebf96;
      border-color: #3ebf96;
      color: #05070a;
      box-shadow: 0 4px 16px rgba(78, 204, 163, 0.35);
    }

    /* Document container */
    .document-wrap {
      width: 100%;
      max-width: 860px;
      padding: 0 16px 48px;
      display: flex;
      justify-content: center;
    }

    .resume-sheet {
      width: 100%;
      max-width: 840px;
      height: auto;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.4);
      display: block;
    }

    /* Print styles */
    @media print {
      body {
        background: #ffffff;
      }
      .topbar {
        display: none;
      }
      .document-wrap {
        padding: 0;
        max-width: 100%;
      }
      .resume-sheet {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 16px;
      }
      .actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Navigation Toolbar -->
  <header class="topbar">
    <div class="info">
      <img src="/img/Me.jpeg" alt="Krish Thakur" class="avatar" />
      <div>
        <h1 class="title">Krish Thakur</h1>
        <p class="subtitle">Software Engineer · Resume</p>
      </div>
    </div>

    <div class="actions">
      <!-- Print button -->
      <button onclick="window.print()" class="btn" type="button" aria-label="Print resume">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>Print</span>
      </button>

      <!-- Raw PDF Direct Link -->
      <a href="/img/Resume.pdf" target="_blank" rel="noopener" class="btn" aria-label="View raw PDF file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span>Raw PDF</span>
      </a>

      <!-- Download PDF button -->
      <a href="/img/Resume.pdf" download="Krish_Thakur_Resume.pdf" class="btn btn-primary" aria-label="Download resume PDF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download PDF</span>
      </a>
    </div>
  </header>

  <!-- Document Preview Container -->
  <main class="document-wrap">
    <object data="/img/Resume.pdf#view=FitH" type="application/pdf" class="resume-sheet" style="height: 88vh; min-height: 820px; border: none;">
      <iframe src="/img/Resume.pdf#view=FitH" style="width: 100%; height: 88vh; min-height: 820px; border: none;" title="Resume PDF">
        <img src="/img/ResumeImg.png" alt="Krish Thakur Software Engineer Resume" class="resume-sheet" />
      </iframe>
    </object>
  </main>

</body>
</html>
